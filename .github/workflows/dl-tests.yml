name: Phase 2 correctness
on:
  push:
  pull_request:
jobs:
  causal-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dl.txt
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install benchmark dependencies
        run: python -m pip install -r requirements-dl.txt
      - name: Check causality, gradients, inference and metrics
        run: python -W ignore -m unittest discover -s tests -p 'test_dl_*.py'
